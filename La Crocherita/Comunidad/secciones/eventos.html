<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Eventos - La Crocherita</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <main class="container mt-5">
      <h2 class="titulo-pagina text-center mb-4">
        <i class="fa-solid fa-calendar-days"></i> Calendario de Eventos
      </h2>

      <div class="navegacion-calendario d-flex justify-content-center align-items-center mb-4">
        <button id="prevMonth" class="btn btn-outline-primary me-2">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <span id="mesActual" class="fw-bold fs-5"></span>
        <button id="nextMonth" class="btn btn-outline-primary ms-2">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <div id="calendar" class="calendar-grid"></div>
    </main>

    <!-- Modal de eventos -->
    <div class="modal fade" id="modalEventos" tabindex="-1" aria-labelledby="modalEventosLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title" id="modalEventosLabel">Eventos del Mes</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <ul id="listaEventos" class="list-group"></ul>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-5 p-4 bg-light">
      <div class="frase mb-2">¡Síguenos en nuestras redes sociales!</div>
      <div class="iconitos mb-2">
        <span><i class="fab fa-facebook fa-lg me-3"></i></span>
        <span><i class="fab fa-instagram fa-lg me-3"></i></span>
        <span><i class="fab fa-pinterest fa-lg"></i></span>
      </div>
      <p class="mb-0">&copy; 2025 La Crocherita. Todos los derechos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/eventos.js"></script>
  </body>
</html>
