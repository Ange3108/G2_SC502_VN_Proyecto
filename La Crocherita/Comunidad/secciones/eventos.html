<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Eventos - La Crocherita</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main class="container mt-5">
      <h2 class="titulo-pagina text-center mb-4">
        <i class="fa-solid fa-calendar-days"></i> Calendario de Eventos
      </h2>

      <div class="navegacion-calendario">
        <button id="prevMonth" class="navegar-mes">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <span id="mesActual" class="mx-3 fw-bold"></span>
        <button id="nextMonth" class="navegar-mes">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <div id="calendar" class="calendar-grid"></div>
    </main>


    <!-- Modal de eventos -->
    <div class="modal fade" id="modalEventos" tabindex="-1" aria-labelledby="modalEventosLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title" id="modalEventosLabel">Eventos del Mes</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <ul id="listaEventos" class="list-group"></ul>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="frase">Síguenos en nuestras redes sociales!</div>
      <div class="iconitos">
        <span><i class="fab fa-facebook"></i></span>
        <span><i class="fab fa-instagram"></i></span>
        <span><i class="fab fa-pinterest"></i></span>
      </div>
      <p>&copy; 2025 La Crocherita. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/eventos.js"></script>
  </body>
</html>
