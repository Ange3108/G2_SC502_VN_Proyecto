<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recordatorio de Clases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../../CSS/style.css"> <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        .card-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .card-container h2 {
            margin-bottom: 25px;
            color: #5b2c6f; /* Color similar al de tu footer */
        }
        .btn-custom {
            background-color: #a14da0;
            border-color: #a14da0;
            color: white;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }
        .btn-custom:hover {
            background-color: #8e44ad;
            border-color: #8e44ad;
            color: white; /* Asegura que el texto siga blanco en hover */
            margin-top: 30px; /* Add some top margin to position it lower */
        }
  
        .btn-custom i {
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="card-container">

        <h2>Recordatorio de Clases</h2>
        <p class="mb-4">Haz clic abajo para ver tus proyectos y recursos disponibles.</p>
        <a href="../../Mis_Proyectos_y_Recursos/Proyectos.html" class="btn btn-custom">
            <i class="fas fa-project-diagram"></i> Mis Proyectos y Recursos
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
