<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - La Crocherita</title>
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>

  <body>
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="card p-4 shadow-lg w-100" style="max-width: 400px">
        <h3 class="card-title text-center mb-4">Login</h3>
        <form id="loginForm" action="../php/auth_process.php" method="POST">
          <input type="hidden" name="action" value="login" />
          <div class="input-group mb-3">
            <span class="input-group-text"
              ><i class="fas fa-envelope"></i
            ></span>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Correo electrónico"
              required
            />
          </div>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              required
              placeholder="Contraseña"
            />
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-info text-white w-100">
              Iniciar sesión
            </button>
          </div>
        </form>
        <div id="login-message" class="mt-3 text-center" style="display: none;"></div>
        <p class="text-center mt-2">
          <a href="contra_olvidada.html">¿Olvidaste tu contraseña?</a>
        </p>
        <p class="text-center mt-3">
          ¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a>
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="../js/Login.js"></script>
  </body>
</html>
