<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - La Crocherita</title>
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="card p-4 shadow-lg w-100" style="max-width: 400px">
        <h3 class="card-title text-center mb-4">Regístrate</h3>
        <form id="registerForm" action="../php/auth_process.php" method="POST">
          <input type="hidden" name="action" value="register" />
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              placeholder="Nombre completo"
              required
            />
          </div>
          <div class="input-group mb-3">
            <span class="input-group-text"
              ><i class="fas fa-envelope"></i
            ></span>
            <input
              type="email"
              class="form-control"
              id="emailRegister"
              name="emailRegister"
              placeholder="Correo electrónico"
              required
            />
          </div>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input
              type="password"
              class="form-control"
              id="passwordRegister"
              name="passwordRegister"
              placeholder="Contraseña"
              required
            />
          </div>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirmar contraseña"
              required
            />
          </div>
          <input type="hidden" name="role" value="estudiante">
          <div class="d-grid">
            <button type="submit" class="btn btn-info text-white w-100">
              Crear cuenta
            </button>
          </div>
        </form>
        <div id="register-message" class="mt-3 text-center" style="display: none;"></div>
        <p class="text-center mt-3">
          ¿Ya tienes una cuenta? <a href="Login.html">Inicia sesión aquí</a>
        </p>
        <div class="d-flex justify-content-between mt-3">
          <button
            onclick="window.history.back()"
            class="btn btn-secondary btn-sm"
          >
            Regresar
          </button>
          <button onclick="location.href='../../Home/Home.php'" class="btn btn-link btn-sm">
            Siguiente
          </button>
          </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="../js/register.js"></script>
  </body>
</html>
