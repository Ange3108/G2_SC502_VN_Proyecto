<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña - La Crocherita</title>
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="../CSS/style.css" />
    <style>
      /* Estilos para el modal/popup */
      .modal {
        display: none; 
        position: fixed; 
        z-index: 1; 
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto; /* Habilitar scroll si el contenido es muy largo */
        background-color: rgba(0, 0, 0, 0.4); /* Fondo semi-transparente */
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background-color: #fefefe;
        margin: 15% auto; /* 15% desde arriba y centrado horizontalmente */
        padding: 20px;
        border: 1px solid #888;
        width: 80%; /* Podría ser un porcentaje o un ancho fijo */
        max-width: 500px; /* Ancho máximo para pantallas grandes */
        border-radius: 8px;
        position: relative;
        text-align: center;
      }

      .close-button {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        position: absolute;
        right: 15px;
        top: 5px;
      }

      .close-button:hover,
      .close-button:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="card p-4 shadow-lg w-100" style="max-width: 400px">
        <h3 class="card-title text-center mb-4">Recuperar Contraseña</h3>
        <form id="forgotPasswordForm" action="../php/proceso_autenticacion.php" method="POST">
          <input type="hidden" name="action" value="forgot_password" />
          <div class="input-group mb-3">
            <span class="input-group-text"
              ><i class="fas fa-envelope"></i
            ></span>
            <input
              type="email"
              class="form-control"
              id="emailRecovery"
              name="email"
              placeholder="Ingresa tu correo electrónico"
              required
            />
          </div>
          <div class="d-grid">
            <button
              type="submit"
              class="btn btn-info text-white w-100"
              id="recoverPasswordBtn"
            >
              Recuperar Contraseña
            </button>
          </div>
        </form>
        <p class="text-center mt-3">
          <a href="Login.html">Volver al inicio de sesión</a>
        </p>
      </div>
    </div>

    <div id="recoveryModal" class="modal">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h5 class="mb-3">¡Recuperación en proceso!</h5>
        <p>
          Si el correo electrónico
          <strong id="recoveryEmailDisplay"></strong> está registrado, recibirás
          instrucciones para restablecer tu contraseña en breve.
        </p>
        <p>Por favor, revisa tu bandeja de entrada y la carpeta de spam.</p>
        <button class="btn btn-info mt-3" id="closeModalBtn">Entendido</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <script src="../js/contra_olvidada.js"></script>
  </body>
</html>
